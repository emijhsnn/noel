@keyframes conf{to{transform:translateY(115vh) rotate(720deg)}}
.corner{position:fixed;bottom:2vh;right:2vw;opacity:.5;font-weight:800;z-index:2}
</style>

async function resize(file){
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const s=Math.min(img.width,img.height), c=document.createElement("canvas"); c.width=c.height=240;
  c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,240,240);
  return c.toDataURL("image/jpeg",.8);
}

  if(a==="winner") await giveClue(g,b.dataset.p);

  if(a==="theme"){ const cur=gst().theme; let t; do{ t=THEMES[Math.floor(Math.random()*THEMES.length)]; }while(t===cur && THEMES.length>1); await upd({theme:t}); }
  if(a==="rev") await upd({reveal:Math.min(4,(gst().reveal||0)+1)});

async function useJoker(actorId, action, targetId, payload){
  await runTransaction(db, async tx=>{
    const pref=doc(db,"players",actorId), p=await tx.get(pref), j=p.data()?.jokers||0;
    if(j<=0) throw new Error("Plus aucun joker !");
    let cref;
    if(action==="delete"){ cref=doc(db,"clues",payload.clueId); const c=await tx.get(cref); if(!c.exists()||c.data().deleted) throw new Error("Cet indice a déjà disparu."); }
    tx.update(pref,{jokers:j-1});
    if(action==="add") tx.set(doc(collection(db,"clues")),{to:targetId,text:payload.text,source:"joker",by:actorId,createdAt:serverTimestamp(),deleted:false});
    else tx.update(cref,{deleted:true,deletedBy:actorId});
  });
}

      if(g.theme && st.theme && !r) h+=`<p class="huge" style="margin-top:2vh">🎨 Thème : <span style="color:var(--gold)">${esc(st.theme)}</span></p>`;
      h+=`<div class="chrono" id="chrono"></div>`;
      if(g.score){ const sc=Object.entries(st.scores?.[s.g]||{}).filter(([,v])=>v!==null&&v!==undefined&&!isNaN(v)).sort((a,b)=>a[1]-b[1]);
        if(sc.length) h+=`<div class="board">${sc.map(([id,v],i)=>`<div class="it">${i===0?"🏆":i+1+"."} ${face(P(id),"s")} ${esc(nameOf(id))} · ${v}${g.score==="chrono"?" s":" cm"}</div>`).join("")}</div>`; }
      if(r==="ok"&&g.type==="col") h+=`<div class="status">✅ Défi réussi ! Indice débloqué :<br><span style="color:var(--gold)">« ${esc(g.clue)} »</span></div>`;
      if(r==="ok"&&g.type==="ind") h+=`<div class="status">🏆 ${face(P(w),"l")}<br>${esc(nameOf(w))} remporte un indice secret… 🤫</div>`;
      if(r==="lost") h+=`<div class="status" style="color:var(--grinch)">😈 Le Grinch a gardé cet indice…</div>`;
    }
    return wrap(h);
  }
  if(s.k==="vote"){
    const t=tally(), voted=plist().filter(p=>(p.vote||[]).length===2).length;
    return wrap(`<h2 class="gamehead" style="font-size:clamp(2rem,5vw,4rem)">🔔 L'heure du verdict</h2>
      <p class="huge" style="font-size:clamp(1.1rem,2.4vw,2rem);margin:0 0 3vh">Sur vos téléphones, désignez les <b style="color:var(--gold)">deux espions</b>. Votre choix est définitif.</p>
      <div class="vgrid">${plist().map(p=>`<div class="vcell">${face(p)}<div class="nm">${esc(p.name)}</div><div class="cnt ${t[p.id]?"":"zero"}" data-cnt="${p.id}">${t[p.id]||0}</div></div>`).join("")}</div>
      <p class="huge" style="margin-top:3vh;font-size:clamp(1.2rem,2.6vw,2.2rem)">🗳️ ${voted} / ${plist().length} ont voté</p>`);
  }
  if(s.k==="reveal"){
    const rv=st.reveal||0, acc=accused(), sp=spies(), found=sp.filter(x=>acc.includes(x.id)).length;
    let h=`<h2 class="gamehead" style="font-size:clamp(1.8rem,4.4vw,3.6rem)">⚖️ Le verdict</h2>`;
    if(rv<2) h+=`<p class="huge" style="font-size:clamp(1.2rem,2.6vw,2.2rem)">La famille accuse…</p>
      <div class="row" style="justify-content:center;gap:6vw;margin:2vh 0">${acc.map(id=>`<div class="vcell">${face(P(id),"l")}<div class="nm" style="font-size:clamp(1.2rem,2.4vw,2rem)">${esc(nameOf(id))}</div></div>`).join("")}</div>`;
    else h+=`<p style="font-size:clamp(1rem,2vw,1.6rem);font-weight:800;margin:0 0 1vh;opacity:.85">La famille a accusé : ${acc.map(id=>esc(nameOf(id))).join(" et ")}</p>`;
    if(rv===1) h+=`<p class="huge" style="animation:beat .4s infinite">🥁 Mais avez-vous vu juste ? 🥁</p>`;
    if(rv>=2){
      h+=`<p class="huge" style="margin:1vh 0;font-size:clamp(1.3rem,3vw,2.6rem)">Les vrais espions du Grinch étaient…</p><div class="row" style="justify-content:center;gap:6vw">`;
      sp.forEach((x,i)=>{ if(rv>=2+i) h+=`<div class="vcell flip"><div class="flipin">${face(x,"l")}</div><div class="nm" style="font-size:clamp(1.2rem,2.4vw,2rem)">${esc(x.name)}</div><div class="spybadge">😈 ESPION !</div></div>`;
        else h+=`<div class="vcell"><div class="face l"><span>?</span></div><div class="nm">…</div></div>`; });
      h+=`</div>`;
    }
    if(rv>=4){
      const msgs=[
        `😈 LE GRINCH A GAGNÉ !<br><span style="font-size:.5em">${sp.map(x=>esc(x.name)).join(" et ")} vous ont roulés dans la farine…</span>`,
        `😬 SAUVÉS DE JUSTESSE…<br><span style="font-size:.5em">Un espion démasqué, mais l'autre vous a bien eus ! Le Père Noël passera… mais il est un peu vexé.</span>`,
        `🎉 NOËL EST SAUVÉ !<br><span style="font-size:.5em">Les espions sont démasqués. Le Père Noël passera bien chez vous cette nuit… 🎅🎁</span>`];
      h+=`<div class="result" style="color:${found===2?"var(--gold)":found===1?"#fff":"var(--grinch)"}">${msgs[found]}</div>`;
      setTimeout(()=>confetti(found===2?"🎉":found===1?"⭐":"😈"),300);
    }
    return wrap(h);
  }
  return wrap("");
}

/* ---------- animations ---------- */
function confetti(ch){
  const set = ch ? [ch,"❄","✨"] : ["🎉","⭐","❄","🎁","✨"];
  for(let i=0;i<40;i++){ const c=document.createElement("span"); c.className="confetti"; c.textContent=set[i%set.length];
    c.style.left=Math.random()*100+"vw"; c.style.animationDuration=(2.5+Math.random()*2.5)+"s"; c.style.animationDelay=(Math.random()*1.2)+"s";
    document.body.appendChild(c); setTimeout(()=>c.remove(),6500); }
}
function bumpVotes(){
  const t=tally();
  $$("[data-cnt]").forEach(el=>{ const v=t[el.dataset.cnt]||0; if(String(v)!==el.textContent){ el.textContent=v; el.classList.toggle("zero",!v); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); } });
}
function tick(){
  const ch=gst().chrono, left = ch?.endsAt ? (ch.endsAt-Date.now())/1000 : null;
  const txt = left===null ? "" : left<=0 ? "⏰ 0:00" : fmtTime(left);
  const el=$("#chrono"); if(el){ el.textContent=txt; el.classList.toggle("low", left!==null && left<=10); }
  const rc=$("#rchrono"); if(rc) rc.textContent = txt || "—";
  const tc=$("#tcorner"); if(tc) tc.textContent = S.me?.tab ? `${STEPS[step()]?.t||""}` : "";
}
</script>
